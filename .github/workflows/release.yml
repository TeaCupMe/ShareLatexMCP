name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked --python 3.11
      - name: Verify tag matches project version
        run: uv run --locked python -c "import os,tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --locked python scripts/check_release.py
      - run: uv venv .release-check --python 3.11
      - run: uv pip install --python .release-check/bin/python dist/*.whl
      - run: .release-check/bin/python -I scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes "Preview release. See CHANGELOG.md and README.md for features, installation and limitations."
